appId: dev.expo.Payments
---
# Desired-behavior assertion, run explicitly after launching --swiftui-list-anchor-probe.
# OPERATION is "Prepend" or "Append"; END_Y controls the short drag's end point.
- assertVisible: "Native anchoring probe"
- tapOn: "Fraction"
- tapOn: "Reset"
- tapOn: "Go to 10"
- runFlow:
    when:
      true: ${END_Y == '60%'}
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 60%
          duration: 700
- runFlow:
    when:
      true: ${END_Y == '50%'}
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 50%
          duration: 700
- waitForAnimationToEnd
- assertVisible: "Native row 10"
- copyTextFrom:
    id: "probe-measurement"
- evalScript: ${output.before = Number(maestro.copiedText.split(' ')[0].split('=')[1])}
- assertTrue: ${isFinite(output.before) && output.before > 0}
- takeScreenshot: /tmp/swiftui-fraction-${OPERATION}-${END_Y}-before
- tapOn: "${OPERATION} 5"
- assertVisible: "${OPERATION} · 205 rows · bound=nil"
- waitForAnimationToEnd
- copyTextFrom:
    id: "probe-measurement"
- evalScript: ${output.after = Number(maestro.copiedText.split(' ')[0].split('=')[1]); console.log(OPERATION + ' before=' + output.before + ' after=' + output.after)}
- takeScreenshot: /tmp/swiftui-fraction-${OPERATION}-${END_Y}-after
# Cached offscreen geometry cannot pass this test on its own.
- assertVisible: "Native row 10"
- assertTrue: ${isFinite(output.after) && Math.abs(output.after - output.before) <= 1}
