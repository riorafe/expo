appId: dev.expo.Payments
---
# Open Playground's hardening example first.
- tapOn: 'Pagination example'
- assertVisible: 'List append pagination'
- scrollUntilVisible:
    element:
      text: 'Row 4 · taps 0'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: '10 rows · 1 requests · More available'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 'Row 9 · taps 0'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: '15 rows · 2 requests · All loaded'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 'Row 14 · taps 0'
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd
- assertVisible: '15 rows · 2 requests · All loaded'
- assertNotVisible:
    id: 'list-missing-.*'
- tapOn: 'Back to hardening'
