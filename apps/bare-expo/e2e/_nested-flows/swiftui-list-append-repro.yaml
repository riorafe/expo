appId: dev.expo.Payments
---
# Open Playground first. Appending must not pull someone away from earlier content.
- tapOn: 'Reset rows'
- tapOn: 'Track row 10'
- scrollUntilVisible:
    element:
      text: 'Row 10 · taps 0'
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: 'Row 10 · taps 0'
- assertVisible: 'Row 10 · taps 1'
- waitForAnimationToEnd
- copyTextFrom:
    id: 'anchor-position'
- evalScript: ${output.before = Number(maestro.copiedText.slice(3))}
- assertTrue: ${isFinite(output.before) && output.before > 0}
- takeScreenshot: /tmp/swiftui-list-append-before
- tapOn: 'Append 5'
- assertVisible: '205 rows · stress idle · step 0'
- waitForAnimationToEnd
- copyTextFrom:
    id: 'anchor-position'
- evalScript: ${output.after = Number(maestro.copiedText.slice(3))}
- takeScreenshot: /tmp/swiftui-list-append-after
- assertVisible: 'Row 10 · taps 1'
- assertTrue: ${isFinite(output.after) && Math.abs(output.after - output.before) <= 1}
- assertNotVisible:
    id: 'list-missing-.*'
- tapOn: 'Stop tracking'
