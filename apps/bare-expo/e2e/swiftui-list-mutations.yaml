appId: dev.expo.Payments
---
# Open Playground first. This checks settled correctness, not frame-time or zero blanks.
- assertVisible: 'List hardening: changing data'
- tapOn: 'Reset rows'
- tapOn: 'Row 0 · taps 0'
- assertVisible: 'Row 0 · taps 1'
- tapOn: 'Swap first two'
- assertVisible: 'Row 0 · taps 1'
- tapOn: 'Prepend'
- assertVisible: 'Row 0 · taps 1'
- tapOn: 'Toggle row 0'
- assertNotVisible: 'Row 0 · taps 1'
- tapOn: 'Toggle row 0'
- assertVisible: 'Row 0 · taps 0'
- tapOn: 'Clear / refill'
- assertVisible: '0 rows · stress idle · step 0'
- tapOn: 'Clear / refill'
- assertVisible: 'Row 0 · taps 0'
- tapOn: 'Start mutation stress'
- repeat:
    times: 8
    commands:
      - swipe:
          start: '50%, 80%'
          end: '50%, 40%'
          duration: 300
      - swipe:
          start: '50%, 40%'
          end: '50%, 80%'
          duration: 300
- extendedWaitUntil:
    visible: '200 rows · stress idle · step 15'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Row 0 · taps 0'
    direction: UP
    timeout: 30000
- assertNotVisible:
    id: 'list-missing-.*'
- tapOn: 'Row 0 · taps 0'
- assertVisible: 'Row 0 · taps 1'
